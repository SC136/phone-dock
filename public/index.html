<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Desk Deck" />
    <title>Desk Deck</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body data-mode="clock">
    <div id="app">
      <!-- Pages sit side by side in a native scroll-snap track, so a swipe follows the finger. -->
      <main id="stage">
        <section class="page" data-mode="clock" aria-label="Clock"><div class="page-in" id="clock-body"></div></section>
        <section class="page" data-mode="ambient" aria-label="Ambient"><div class="page-in" id="ambient-body"></div></section>
        <section class="page" data-mode="weather" aria-label="Weather"><div class="page-in" id="weather-body"></div></section>
        <section class="page" data-mode="stats" aria-label="PC stats"><div class="page-in" id="stats-body"></div></section>
        <section class="page" data-mode="agents" aria-label="Coding agents"><div class="page-in" id="agents-body"></div></section>
        <section class="page" data-mode="deck" aria-label="Stream deck"><div class="page-in" id="deck-body"></div></section>
        <section class="page" data-mode="music" aria-label="Music"><div class="page-in" id="music-body"></div></section>
      </main>

      <nav id="dock" aria-label="Modes">
        <span class="dock-ind"></span>
        <div id="dock-items"></div>
        <button id="btn-settings" class="dock-item dock-gear" aria-label="Settings"></button>
      </nav>
    </div>

    <div id="dimmer" hidden>
      <div class="dim-inner">
        <div id="dim-time" class="dim-time">--:--</div>
      </div>
    </div>

    <aside id="sheet" hidden aria-label="Settings">
      <div class="sheet-card" role="dialog">
        <div class="sheet-grab"></div>
        <div class="sheet-head">
          <h2>Settings</h2>
          <button id="sheet-close" class="icon-btn" aria-label="Close"></button>
        </div>
        <div id="sheet-body"></div>
      </div>
    </aside>

    <div id="offline-pill" aria-live="polite">No connection</div>
    <div id="blank" aria-hidden="true"></div>
    <div id="toast"></div>

    <script src="/app.js"></script>
  </body>
</html>
